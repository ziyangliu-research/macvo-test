version: 1

# Serial baseline for TartanAir V1 Stereo Challenge SH003, frames [0, 200).
# All 200 frames are train/insert frames. The command uses
# run_pipeline_execution_benchmark_repro.py --mode serial.
#
# ReSplat uses the validated tartanair_p000_ft preprocessing unchanged
# (320x320) and the corrected per-batch CUDA stream dependency in
# async_pipeline/resplat_runtime.py.

paths:
  macvo_repo: .
  resplat_repo: ../Resplat
  gs_repo: ../gaussian-splatting
  odom_config: Config/Experiment/MACVO/MACVO_Performant.yaml
  data_config: Config/Sequence/TartanAirV1_Challenge_SH003.yaml
  resplat_checkpoint: null
  work_dir: outputs/macvo_resplat_SH003_0_200_fixed_stream

sequence:
  start_index: 0
  end_index: 200

camera:
  stereo_baseline: 0.25
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0
  left_subdir: image_left
  right_subdir: image_right
  left_pattern: "{index:06d}_left.png"
  right_pattern: "{index:06d}_right.png"

pose_frontend:
  commit_policy: one_frame_delayed
  dedicated_cuda_stream: false

resplat_frontend:
  experiment: tartanair_p000_ft
  device: cuda:0
  refine_steps: 0
  refine_use_target: false
  deterministic: false
  # Keep the validated ReSplat experiment default: dataset.image_shape=[320,320].
  overrides: []
  input_mode: shared_tensors
  handoff_mode: pinned_cpu
  strict_validation: false

# run_pipeline_execution_benchmark.py does not consume split.enabled, so use an
# out-of-range periodic split to make every frame an inserted/train frame.
split:
  split_every: 1000000
  split_offset: 999999
  split_index_mode: local_index

evaluation:
  gt_pose_file: /home/shiyo/Desktop/Datasets/TartanAir_Stereo_Challenge/ground_truth/stereo_gt/SH003.txt

runtime:
  backend_mode: incremental
  queue_size: 2
  poll_timeout_sec: 0.05
  initialization_timeout_sec: 600.0
  preload: false
  pin_packet_memory: true

backend:
  output_name: incremental_SH003_0_200_allframes_i100_dp50_fixed_stream
  device: cuda:0
  sh_degree: 3
  local_map_size: 10
  iterations_per_packet: 100
  reset_new_packet_opacity: true
  new_packet_reset_max_opacity: 0.01
  maintenance_mode: standard
  maintenance_after_local_iteration: 50
  maintenance_grad_threshold: -1.0
  maintenance_min_opacity: 0.005
  maintenance_max_screen_size: -1.0
  spatial_lr_scale: 1.0
  minimum_scene_extent: 1.0
  white_background: false
  antialiasing: false

  # Suppress expensive intermediate map evaluation. finalize() still computes the
  # final processed-view reconstruction metrics when evaluation_enabled=true.
  eval_before_optimization: false
  eval_every_train_packets: 1000000
  eval_max_views: 0
  save_every_train_packets: 0
  save_final_ply: false

  wandb_mode: online
  wandb_project: macvo-resplat-tartanair-v1-comparison
  wandb_run_name: SH003_0_200_allframes_i100_dp50_fixed_stream
  wandb_log_interval: 100
  dedicated_cuda_stream: false
  invalid_pose_policy: skip
  write_runtime_artifacts: true
  evaluation_enabled: true

  optimization:
    iterations: 20000
    position_lr_init: 0.00016
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    feature_lr: 0.0025
    opacity_lr: 0.025
    scaling_lr: 0.005
    rotation_lr: 0.001
    exposure_lr_init: 0.01
    exposure_lr_final: 0.001
    exposure_lr_delay_steps: 0
    exposure_lr_delay_mult: 0.0
    percent_dense: 0.01
    lambda_dssim: 0.2
    densify_grad_threshold: 0.0002
    random_background: false
    optimizer_type: default
