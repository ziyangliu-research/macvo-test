version: 1

# Rectified ETH3D smoke-test configuration.
# Dataset-specific camera values are read from calibration.json by the
# ETH3D_Rectified loader.  The camera block below is only a positive fallback for
# generic pipeline construction; ETH3D shared-tensor ReSplat uses the exact
# per-frame rectified K and baseline.

paths:
  macvo_repo: .
  resplat_repo: ../Resplat
  gs_repo: ../gaussian-splatting
  odom_config: Config/Experiment/MACVO/MACVO_Performant.yaml
  data_config: Config/Sequence/ETH3D_mannequin_face_1_rectified.yaml
  resplat_checkpoint: null
  work_dir: outputs/eth3d_mannequin_face_1_smoke

sequence:
  start_index: 0
  end_index: 20

camera:
  stereo_baseline: 0.09
  fx: 500.0
  fy: 500.0
  cx: 370.0
  cy: 230.0
  left_subdir: image_left
  right_subdir: image_right
  left_pattern: "{index:06d}.png"
  right_pattern: "{index:06d}.png"

pose_frontend:
  source: macvo
  commit_policy: one_frame_delayed
  dedicated_cuda_stream: false

resplat_frontend:
  experiment: tartanair_p000_ft
  device: cuda:0
  refine_steps: 0
  refine_use_target: false
  deterministic: false
  # 512/320 = 1.6, almost exactly mannequin_face_1 rectified aspect ratio.
  # ReSplat requires both H and W to be divisible by 64.
  overrides:
    - dataset.image_shape=[320,512]
  input_mode: shared_tensors
  handoff_mode: pinned_cpu
  strict_validation: false

# All frames are used for the standalone smoke tests.  No held-out split is
# relevant until we decide ETH3D is suitable for the full benchmark.
split:
  split_every: 1000000
  split_offset: 999999
  split_index_mode: local_index

evaluation:
  gt_pose_file: null
  gt_source: dataset

runtime:
  # ReSplat-only and MAC-VO-only smoke tests do not construct/run GraphDECO.
  backend_mode: null
  queue_size: 2
  poll_timeout_sec: 0.05
  initialization_timeout_sec: 600.0
  preload: false
  pin_packet_memory: true

backend:
  # Retained only because the common pipeline schema expects this section.
  output_name: incremental_ETH3D_mannequin_face_1_smoke
  device: cuda:0
  sh_degree: 3
  local_map_size: 20
  iterations_per_packet: 100
  reset_new_packet_opacity: true
  new_packet_reset_max_opacity: 0.01
  maintenance_mode: standard
  maintenance_after_local_iteration: 50
  maintenance_grad_threshold: -1.0
  maintenance_min_opacity: 0.10
  maintenance_max_screen_size: -1.0
  spatial_lr_scale: 1.0
  minimum_scene_extent: 1.0
  white_background: false
  antialiasing: false
  eval_before_optimization: false
  eval_every_train_packets: 1000000
  eval_max_views: 0
  save_every_train_packets: 0
  save_final_ply: false
  wandb_mode: disabled
  wandb_project: macvo-resplat-eth3d
  wandb_run_name: mannequin_face_1_smoke
  wandb_log_interval: 100
  dedicated_cuda_stream: false
  invalid_pose_policy: skip
  write_runtime_artifacts: true
  evaluation_enabled: false
  optimization:
    iterations: 2000
    position_lr_init: 0.00016
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    feature_lr: 0.0025
    opacity_lr: 0.025
    scaling_lr: 0.005
    rotation_lr: 0.001
    exposure_lr_init: 0.01
    exposure_lr_final: 0.001
    exposure_lr_delay_steps: 0
    exposure_lr_delay_mult: 0.0
    percent_dense: 0.01
    lambda_dssim: 0.2
    densify_grad_threshold: 0.0002
    random_background: false
    optimizer_type: default
