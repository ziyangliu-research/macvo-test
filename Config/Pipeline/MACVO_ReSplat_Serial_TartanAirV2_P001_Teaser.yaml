version: 1

# Qualitative teaser configuration for TartanAir v2 House/P001.
# Default smoke range is frames [0,21), matching the old inclusive packet range 0-20.
# All selected frames are mapping/train frames for this visualization run.
# Quantitative paper benchmarks keep the separate strict held-out protocol.

paths:
  macvo_repo: .
  resplat_repo: ../Resplat
  gs_repo: ../gaussian-splatting
  odom_config: Config/Experiment/MACVO/MACVO_Performant.yaml
  data_config: Config/Sequence/TartanAirV2_House_easy_P001.yaml
  resplat_checkpoint: null
  work_dir: outputs/p001_teaser_overview/0_20

sequence:
  start_index: 0
  end_index: 21

camera:
  stereo_baseline: 0.25000006
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 320.0
  left_subdir: image_lcam_front
  right_subdir: image_rcam_front
  left_pattern: "{index:06d}_lcam_front.png"
  right_pattern: "{index:06d}_rcam_front.png"

pose_frontend:
  source: macvo
  commit_policy: one_frame_delayed
  dedicated_cuda_stream: false

resplat_frontend:
  experiment: tartanair_p000_ft
  device: cuda:0
  refine_steps: 0
  refine_use_target: false
  deterministic: false
  overrides: []
  input_mode: shared_tensors
  handoff_mode: pinned_cpu
  strict_validation: false

# Teaser visualization only: use every selected frame for mapping so [0,21)
# corresponds to the old fused packet range 0-20. No held-out metric is reported.
split:
  split_every: 1000000
  split_offset: 999999
  split_index_mode: local_index

runtime:
  backend_mode: incremental
  queue_size: 2
  poll_timeout_sec: 0.05
  initialization_timeout_sec: 600.0
  preload: false
  pin_packet_memory: true

backend:
  output_name: incremental_P001_teaser_0_20
  device: cuda:0
  sh_degree: 3
  local_map_size: 20
  iterations_per_packet: 100
  reset_new_packet_opacity: true
  new_packet_reset_max_opacity: 0.01
  maintenance_mode: standard
  maintenance_after_local_iteration: 50
  maintenance_grad_threshold: -1.0
  maintenance_min_opacity: 0.10
  maintenance_max_screen_size: -1.0
  spatial_lr_scale: 1.0
  minimum_scene_extent: 1.0
  white_background: false
  antialiasing: false

  eval_before_optimization: false
  eval_every_train_packets: 1000000
  eval_max_views: 0
  save_every_train_packets: 0
  save_final_ply: false
  wandb_mode: disabled
  wandb_project: macvo-resplat-p001-teaser
  wandb_run_name: P001_teaser_0_20
  wandb_log_interval: 100
  dedicated_cuda_stream: false
  invalid_pose_policy: skip
  write_runtime_artifacts: true
  evaluation_enabled: false

  optimization:
    # Launcher overrides this to selected_frame_count * 100 for bookkeeping.
    iterations: 2100
    position_lr_init: 0.00016
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    feature_lr: 0.0025
    opacity_lr: 0.025
    scaling_lr: 0.005
    rotation_lr: 0.001
    exposure_lr_init: 0.01
    exposure_lr_final: 0.001
    exposure_lr_delay_steps: 0
    exposure_lr_delay_mult: 0.0
    percent_dense: 0.01
    lambda_dssim: 0.2
    densify_grad_threshold: 0.0002
    random_background: false
    optimizer_type: default
